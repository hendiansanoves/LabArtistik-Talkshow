<style>
/* VOICE: ruang kelas studio yang rapi dan ramah, seperti lembar kerja kru produksi
IDEA: studio TV mini: denah lantai, kamera dengan lampu tally merah, monitor ruang kontrol
PICTURE: Lab 3D, ruang studio yang bisa ditata dan dilihat dari tiap kamera
COLOUR and TYPE: aubergine tua + putih, aksen merah tally; Archivo + Source Sans 3
LAYOUT: bilah atas berisi navigasi; lab = monitor besar kiri + panel langkah kanan */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#151019);--ink:light-dark(#1d1524,#f1ecf5);--mut:light-dark(#5e5368,#b4a9bf);--soft:light-dark(#f3eef7,#211a29);--line:light-dark(#e2dae9,#3a2f45);--plum:#2b1d3a;--plum2:light-dark(#4a3463,#9b84b8);--tally:light-dark(#c81e36,#ff5a6e);--ok:light-dark(#1f7a4d,#5fd39a);--warn:light-dark(#9a5a00,#ffb547);--floor:light-dark(#f6f2f9,#1c1623);--fur:light-dark(#b9a6c9,#5a4870);--riser:light-dark(#e6dcef,#2c2337)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Source Sans 3',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;line-height:1.1;margin:0 0 .45em;text-wrap:balance}
h1{font-size:clamp(30px,4.4vw,46px);font-weight:800;line-height:1.05}
h2{font-size:26px;font-weight:800}h3{font-size:20px;font-weight:700;font-family:'Source Sans 3',system-ui,sans-serif}
p{margin:0 0 .8em}ul{margin:0;padding-left:1.2em}li{margin:.25em 0}
a{color:var(--tally)}
.top{background:var(--plum);color:#f4eefa;padding:14px max(4vw,16px) 0}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1180px;margin:0 auto}
.tally{width:12px;height:12px;border-radius:50%;background:#ff4d63;box-shadow:0 0 0 4px rgba(255,77,99,.25);flex:none}
.brand b{font-family:Archivo;font-weight:800;font-size:20px}
.brand span{opacity:.75;font-size:15px}
.chip{margin-left:auto;font-size:14px;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.12)}
main{max-width:1180px;margin:0 auto;padding:clamp(22px,4vw,44px) max(4vw,16px) 64px}
section{margin-bottom:26px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:14px;padding:18px}
.soft{background:var(--soft);border-color:transparent}
.mut{color:var(--mut)}.small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:600 16px 'Source Sans 3',sans-serif;min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.btn.pri{background:var(--tally);border-color:var(--tally);color:#fff}
.btn[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.hot:focus-visible,canvas:focus-visible{outline:3px solid var(--tally);outline-offset:2px}
input,textarea,select{font:16px 'Source Sans 3',sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:84px;resize:vertical}
input[type=color]{padding:4px;width:64px;flex:none;cursor:pointer}
input[type=range]{padding:0;min-height:32px;accent-color:var(--tally);border:0}
label{font-weight:600;font-size:15px;display:block;margin:12px 0 4px}
label.chk{display:flex;gap:10px;align-items:center;font-weight:600;cursor:pointer}
.chk input,.opt input{width:22px;height:22px;min-height:22px;flex:none;margin:0}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--tally)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.fig svg{width:100%;height:auto;display:block;border-radius:12px}
.badge{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.red{color:var(--tally)}
.q{border-top:1px solid var(--line);padding:16px 0}
.q p{font-weight:600}
.opt{font-weight:400!important;display:flex!important;gap:10px;align-items:flex-start;margin:6px 0!important;padding:10px 12px;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.wrong{border-color:var(--tally);background:color-mix(in srgb,var(--tally) 8%,transparent)}
.exp{font-size:15px;color:var(--mut);margin:6px 0 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--mut);font-weight:600}
td.n,th.n{text-align:right;white-space:nowrap}
.big{font:800 clamp(40px,6vw,56px)/1 Archivo,sans-serif}
.pal{display:flex;height:44px;border-radius:10px;overflow:hidden;margin:12px 0}
.pal i{display:grid;place-items:center;font:700 13px 'Source Sans 3';color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.pick3{display:grid;gap:8px}.pick3 .row{flex-wrap:nowrap}
.chks li{list-style:none;margin:6px 0;padding-left:0}
.warnbox{border-left:4px solid var(--tally);padding:10px 14px;background:var(--soft);border-radius:0 10px 10px 0;margin-top:12px}
.okbox{border-left:4px solid var(--ok);padding:10px 14px;background:var(--soft);border-radius:0 10px 10px 0;margin-top:12px}
.floor{fill:var(--floor)}.gl{stroke:var(--line);stroke-width:1}.pBack{stroke:var(--plum2)}.pAcc{fill:var(--tally)}.pRiser{fill:var(--riser)}.pFur{fill:var(--fur)}.pTable{fill:var(--bg);stroke:var(--fur);stroke-width:3}.pPlant{fill:light-dark(#5f8f5c,#6fa86b)}.pCam{fill:var(--ink)}
.dash{fill:none;stroke:var(--mut);stroke-dasharray:6 6;stroke-width:1.5}
.lb{fill:var(--ink);font:600 13px 'Source Sans 3',sans-serif}.lbw{fill:#fff;font:700 11px Archivo,sans-serif}
.hot{cursor:pointer;outline:none}.hot:hover{opacity:.8}
.hot.on .pBack,.hot.on .dash{stroke:var(--tally)}
.hot.on :is(rect,circle):not(.dash){stroke:var(--tally);stroke-width:3}.hot.on .lb{fill:var(--tally)}
.wedge{fill:var(--line);fill-opacity:.5}.wedge.on{fill:var(--tally);fill-opacity:.16;stroke:var(--tally);stroke-width:1.5}
.line180{stroke:var(--tally);stroke-dasharray:8 6;stroke-width:2}
.modal{position:fixed;inset:0;background:rgba(20,12,28,.6);display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{max-width:440px;width:100%;background:var(--bg)}
.scroll{overflow-x:auto}
/* Lab 3D */
.lab{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.mon{background:#17131c;border-radius:14px;padding:10px;position:sticky;top:10px}
.mon canvas{display:block;width:100%;aspect-ratio:16/9;border-radius:8px;touch-action:none;cursor:grab;background:#17131c}
.mon canvas.drag{cursor:grabbing}
.hud{display:flex;gap:8px;align-items:center;color:#efe8f6;font:600 14px 'Source Sans 3';padding:4px 4px 10px;flex-wrap:wrap}
.hud .dot{width:10px;height:10px;border-radius:50%;background:#6d6377}.hud .dot.on{background:#ff4d63;box-shadow:0 0 8px #ff4d63}
.views{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px}
.views .btn{background:#2a2231;color:#efe8f6;border-color:#3d3346}
.views .btn[aria-pressed=true]{background:#ff4d63;border-color:#ff4d63;color:#fff}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-bottom:14px}
.steps button{all:unset;cursor:pointer;text-align:center;padding:8px 2px;border-bottom:3px solid var(--line);font-weight:600;font-size:14px;color:var(--mut)}
.steps button b{display:block;font:800 18px Archivo,sans-serif}
.steps button[aria-current=true]{color:var(--ink);border-color:var(--tally)}
.steps button:focus-visible{outline:3px solid var(--tally)}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.cat .btn{font-size:14px;padding:8px 10px;min-height:44px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.objs .btn{min-height:34px;padding:4px 10px;font-size:14px}
.sl{display:grid;grid-template-columns:7.5em minmax(0,1fr) 4.5em;gap:8px;align-items:center}
.sl label{margin:0;font-size:14px}.sl output{font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.shot{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.shot .ph{aspect-ratio:16/9;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-size:13px;color:var(--mut);overflow:hidden}

.mv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:#17131c;padding:8px;border-radius:14px}

canvas.demo{display:block;width:100%;aspect-ratio:16/9;border-radius:6px;background:#17131c}

.views4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.views4 figure{margin:0}.views4 canvas.demo{border-radius:10px}.views4 figcaption{font-size:14px;margin-top:6px;color:var(--mut)}.views4 figcaption b{color:var(--ink)}
.shotsg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.shotsg figure{margin:0}.shotsg img{width:100%;border-radius:10px;display:block}.shotsg figcaption{font-size:14px;margin-top:4px}

const EP=[
{id:'e1',no:1,title:'Layout properti set',tujuan:'Menata layout properti set talkshow sesuai konsep program.',
poin:['Unsur set: backdrop, area host, area tamu, coffee table, riser, properti dekoratif, dan elemen branding.','Bentuk layout: melengkung (banyak narasumber), berhadapan menyerong (1–2 tamu), bentuk L, dan meja panel.','Titik fokus adalah talent; properti mendukung, tidak bersaing.','Keseimbangan simetris terasa formal; asimetris terasa santai dan dinamis.','Layering: foreground, midground (talent), dan background agar gambar tidak datar.','Jarak talent ke backdrop ±1,5–2 m; sisakan jalur kru, kamera, dan kabel.'],
quiz:[
{q:'Berapa jarak yang disarankan antara talent dan backdrop?',o:['Menempel di dinding','Sekitar 30 cm','Sekitar 1,5–2 m','Minimal 6 m'],a:2,e:'Jarak ±1,5–2 m mencegah bayangan jatuh ke backdrop dan membuat latar sedikit blur.'},
{q:'Mengapa kursi host dan tamu diserongkan ±30–45°?',o:['Agar studio terlihat lebih luas','Agar wajah talent terlihat jelas oleh kamera','Agar kabel tidak terlihat','Agar lampu lebih hemat'],a:1,e:'Teknik "cheating to camera": talent tetap saling berbicara, tetapi wajahnya terbuka ke kamera.'},
{q:'Bentuk layout yang paling cocok untuk talkshow dengan banyak narasumber adalah…',o:['Melengkung (arc)','Satu kursi di tengah','Berhadapan lurus','Berjajar membelakangi kamera'],a:0,e:'Layout melengkung menempatkan semua narasumber dalam satu busur sehingga mudah dibingkai.'},
{q:'Apa fungsi riser pada set talkshow?',o:['Tempat menyimpan properti','Menaikkan talent dan menambah kedalaman gambar','Menutupi kabel lampu','Tempat kamera utama'],a:1,e:'Riser mengangkat area talent sehingga terpisah dari lantai studio dan gambar terasa berlapis.'},
{q:'Layering dalam penataan set terdiri dari…',o:['Atas, tengah, bawah','Kiri, tengah, kanan','Foreground, midground, background','Host, tamu, penonton'],a:2,e:'Tiga lapis kedalaman membuat gambar tidak datar.'}]},
{id:'e2',no:2,title:'Pemilihan warna set',tujuan:'Memilih skema warna sesuai karakter program, kebutuhan kamera, dan pencahayaan.',
poin:['Warna membangun mood dan identitas program, serta memisahkan talent dari latar.','Aturan 60-30-10: 60% dominan (backdrop), 30% pendukung (furnitur, lantai), 10% aksen (bantal, lampu, logo).','Sesuaikan genre: hiburan hangat, diskusi serius kalem dan kredibel, gaya hidup lembut, anak muda kontras.','Hindari bidang luas putih murni dan hitam pekat, motif garis rapat (moiré), dan merah sangat jenuh.','Backdrop dibuat sedikit lebih gelap atau lebih kalem dari wajah talent.','Material doff lebih aman daripada glossy; suhu warna lampu ikut mengubah warna set.'],
quiz:[
{q:'Dalam aturan 60-30-10, porsi 60% biasanya untuk…',o:['Aksen seperti bantal dan logo','Backdrop atau dinding set','Kostum host','Lantai area penonton'],a:1,e:'Bidang terluas, yaitu backdrop, membawa warna dominan.'},
{q:'Mengapa backdrop bermotif garis rapat sebaiknya dihindari?',o:['Harganya mahal','Menimbulkan moiré di kamera','Sulit dibersihkan','Membuat studio panas'],a:1,e:'Pola rapat berbenturan dengan sensor kamera sehingga tampak bergetar (moiré).'},
{q:'Arah warna yang cocok untuk talkshow diskusi serius adalah…',o:['Neon dan kontras tinggi','Pastel lembut','Navy, abu-abu, dan aksen kecil','Oranye dan kuning cerah'],a:2,e:'Warna kalem terasa kredibel dan profesional.'},
{q:'Agar talent menonjol, backdrop sebaiknya…',o:['Lebih terang dari wajah talent','Sedikit lebih gelap atau kalem dari wajah talent','Berwarna sama dengan kostum','Putih murni'],a:1,e:'Perbedaan terang-gelap memisahkan talent dari latar.'},
{q:'Jika studio memakai chroma key, properti berwarna apa yang harus dihindari?',o:['Merah dan oranye','Hijau atau biru','Cokelat kayu','Abu-abu'],a:1,e:'Warna kunci chroma ikut terhapus bersama latar.'}]},
{id:'e3',no:3,title:'Peletakan properti & angle kamera',tujuan:'Meletakkan properti berdasarkan posisi dan angle kamera sehingga setiap shot tertata.',
poin:['Talkshow standar memakai 3 kamera: Cam 1 ke tamu, Cam 2 di tengah (wide / two-shot), Cam 3 ke host.','Aturan 180°: semua kamera berada di satu sisi garis imajiner antara host dan tamu.','Setiap kamera melihat zona latar yang berbeda; isi tiap zona agar tidak ada shot berlatar kosong.','Properti tinggi di belakang, yang rendah di depan; hindari benda yang "tumbuh" dari kepala talent.','Logo program terlihat di wide shot dan minimal di satu close-up.','Wide ±24–35 mm, MCU/CU ±50–85 mm.'],
quiz:[
{q:'Kamera yang biasanya mengambil wide shot atau two-shot adalah…',o:['Cam 1 di kiri','Cam 2 di tengah','Cam 3 di kanan','Kamera di belakang backdrop'],a:1,e:'Cam 2 di tengah melihat seluruh set.'},
{q:'Aturan 180° berarti…',o:['Kamera diputar 180° setiap segmen','Semua kamera berada di satu sisi garis imajiner host–tamu','Set harus berbentuk setengah lingkaran','Kursi harus berjarak 180 cm'],a:1,e:'Bila kamera menyeberangi garis, arah pandang talent di layar jadi terbalik.'},
{q:'Properti yang tinggi sebaiknya diletakkan…',o:['Di depan talent','Di belakang, sebagai latar','Di jalur kamera','Di atas coffee table'],a:1,e:'Properti tinggi di belakang mengisi latar tanpa menutupi talent.'},
{q:'Istilah benda "tumbuh dari kepala" artinya…',o:['Talent memakai topi','Properti latar tampak menempel pada kepala talent di frame','Lampu terlalu dekat','Kamera terlalu tinggi'],a:1,e:'Geser properti atau kamera agar latar di sekitar kepala bersih.'},
{q:'Focal length yang sesuai untuk close-up adalah sekitar…',o:['10–14 mm','24–35 mm','50–85 mm','300 mm'],a:2,e:'50–85 mm memberi perspektif wajah yang natural.'}]}];

function checks(c){
  const out=[],L60=lum(c.p60);

  for(const [k,n] of [['p60','Warna 60%'],['p30','Warna 30%']]){const [h,s,l]=hsl(c[k]);if((h<15||h>345)&&s>.7&&l>.25&&l<.7)out.push(n+' merah sangat jenuh di bidang luas: mudah "bocor" (bleeding) di kamera.')}
  if(L60>lum(SKIN))out.push('Backdrop lebih terang dari wajah talent: talent kurang menonjol. Coba warna yang lebih gelap atau kalem.');
  const a=lum(c.p10),ratio=(Math.max(a,L60)+.05)/(Math.min(a,L60)+.05);
  if(ratio<1.6)out.push('Warna aksen kurang kontras dengan backdrop: logo dan titik fokus sulit terlihat.');
  for(const k of ['p60','p30','p10']){const [h,s]=hsl(c[k]);if(s>.45&&((h>=85&&h<=155)||(h>=195&&h<=250))){out.push('Ada warna hijau/biru kuat: jangan dipakai jika studio menggunakan chroma key.');break}}
  return out;
}

  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>`${3+3*i} 0 R`).join(' ')}] /Count ${n} >>`);
  pages.forEach((pg,i)=>{const pid=3+3*i,cid=pid+1,iid=pid+2;const jpg=b64bytes(pg.toDataURL('image/jpeg',0.86));const cs=enc.encode('q 595.28 0 0 841.89 0 0 cm /Im0 Do Q');
    obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>`);
    obj(cid,`<< /Length ${cs.length} >>`,cs);
    obj(iid,`<< /Type /XObject /Subtype /Image /Width ${pg.width} /Height ${pg.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>`,jpg)});

/* ---------- interaksi ---------- */
function upd2(){const f=$('#f2');if(f)f.innerHTML=front(S.pal);const p=$('#pb');if(p)p.innerHTML=palbar(S.pal);const c=$('#ck');if(c)c.innerHTML=chkList(S.pal);for(const k of ['p60','p30','p10']){const h=$('#h-'+k);if(h)h.textContent=hexOk(S.pal[k]).toUpperCase()}}
function updL(){const p=L().pal;const b=$('#lpb');if(b)b.innerHTML=palbar(p);const c=$('#lck');if(c)c.innerHTML=chkListL();const sr=$('#lsrc');if(sr)sr.textContent='Sumber palet: '+(L().palSrc||'Ubahan sendiri');for(const k of ['p60','p30','p10']){const h=$('#lh-'+k);if(h)h.textContent=hexOk(p[k]).toUpperCase()}draw()}
$('#nav').addEventListener('click',ev=>{const b=ev.target.closest('[data-go]');if(b)go(b.dataset.go)});
document.querySelector('[data-fs]').addEventListener('click',()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{chip('Layar penuh tidak didukung di jendela ini. Tekan F11.');setTimeout(()=>chip(),4000)})}catch(e){chip('Tekan F11 untuk layar penuh.');setTimeout(()=>chip(),4000)}});
document.addEventListener('fullscreenchange',()=>{$('#fslbl').textContent=document.fullscreenElement?'Keluar layar penuh':'Layar penuh';setTimeout(()=>{if(S.view==='lab')fitCanvas();paintDemos()},120)});
app.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-k],[data-cam]');if(!t)return;const ds=t.dataset;
  if('go' in ds)return go(ds.go);
  if('ident' in ds)return go('pembuka');
  if('btab' in ds){S.btab=ds.btab;return render()}
  if('mtab' in ds){S.mtab=ds.mtab;return render()}
  if('ans' in ds){const e=S.ep;(S.draft[e]||(S.draft[e]={}))[Number(ds.i)]=Number(ds.ans);return render()}
  if('qgo' in ds){const qi=S.qi||(S.qi={});qi[S.ep]=Number(ds.qgo);return render()}
  if('saveid' in ds)return saveId();
  if('next' in ds){const e=EP.find(e=>!qs(S.me,e.id));if(e){S.ep=e.id;S.mtab='jelas';return go('materi')}return go('lab')}
  if('open' in ds){S.ep=ds.open;S.mtab='jelas';return go('materi')}
  if('ep' in ds){S.ep=ds.ep;return render()}
  if('k' in ds){S.info=ds.k;render();const el=document.querySelector(`[data-k="${ds.k}"]`);if(el)el.focus();return}
  if('genre' in ds){S.genre=Number(ds.genre);S.pal=clone(PRESET[S.genre].c);S.me.mpal=clone(S.pal);S.me.mgenre=S.genre;save();return render()}
  if('cam' in ds){S.cam=ds.cam;return render()}
  if('cross' in ds){S.cross=!S.cross;S.cam='cam1';return render()}
  if('grade' in ds){const e=EP.find(x=>x.id===ds.grade),d=S.draft[e.id]||{};const sc=e.quiz.reduce((s,q,i)=>s+(d[i]===q.a?1:0),0);const prev=qs(S.me,e.id);S.me.quiz[e.id]={last:sc,best:Math.max(sc,prev?prev.best:0),total:e.quiz.length};S.shown[e.id]=true;save();return render()}
  if('retry' in ds){S.shown[ds.retry]=false;S.draft[ds.retry]={};(S.qi||(S.qi={}))[ds.retry]=0;return render()}
  if('pdf' in ds)return makePdf();
  // Lab
  if('step' in ds){S.step=ds.step;S.sure='';return panel()}
  if('lv' in ds){S.lv=ds.lv;if(ds.lv.startsWith('cam'))S.lcam=ds.lv;const keep=S.step;render();S.step=keep;panel();return}
  if('zoom' in ds){S.orbit.r=Math.min(20,Math.max(4,S.orbit.r*Number(ds.zoom)));return draw()}
  if('add' in ds){const Lb=L(),id='o'+(++Lb.nid);Lb.objs.push({id,t:ds.add,x:0,z:ds.add==='backdrop'||ds.add==='logo'||ds.add==='led'||ds.add==='panel'?-3.3:0.6,r:0});S.sel=id;panel();draw();later();return}
  if('pick' in ds){S.sel=ds.pick;panel();draw();return}
  if('rot' in ds){const o=L().objs.find(q=>q.id===S.sel);if(o){o.r=((o.r+Number(ds.rot)+540)%360)-180;draw();selInfo();later()}return}
  if('nudge' in ds){const o=L().objs.find(q=>q.id===S.sel);if(o){const [dx,dz]=ds.nudge.split(',').map(Number);o.x=snap(clampX(o.x+dx));o.z=snap(clampZ(o.z+dz));draw();selInfo();later()}return}
  if('dup' in ds){const o=L().objs.find(q=>q.id===S.sel);if(o){const Lb=L(),id='o'+(++Lb.nid);Lb.objs.push({id,t:o.t,x:snap(clampX(o.x+0.5)),z:o.z,r:o.r});S.sel=id;panel();draw();later()}return}
  if('del' in ds){if(S.sel)delObj(S.sel);return}
  if('reset' in ds){if(S.sure!==ds.reset){S.sure=ds.reset;return panel()}S.sure='';L().objs=ds.reset==='template'?TEMPLATE():[];S.sel=null;panel();draw();later();return}
  if('lgenre' in ds){const pr=PRESET[Number(ds.lgenre)];L().pal=clone(pr.c);L().palSrc=pr.n;L().palTouched=true;panel();draw();later();return}
  if('lmateri' in ds){if(S.me.mpal){L().pal=clone(S.me.mpal);L().palSrc='Palet buatan di Materi 2';L().palTouched=true;panel();draw();later()}return}
  if('lcam' in ds){S.lcam=ds.lcam;panel();draw();return}
  if('aim' in ds){const tg=ds.aim==='tengah'?setCenter():headOf(ds.aim);if(tg){aimAt(S.lcam,tg);updSl();draw();later()}return}
  if('shot' in ds){capture(ds.shot);save();return panel()}
  if('unshot' in ds){delete S.shots[ds.unshot];saveShots();return panel()}
});
app.addEventListener('keydown',ev=>{if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.hot')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
app.addEventListener('change',ev=>{
  const t=ev.target,ds=t.dataset;
  if('q' in ds){(S.draft[ds.q]||(S.draft[ds.q]={}))[Number(ds.i)]=Number(t.value);const e=EP.find(x=>x.id===ds.q);const b=app.querySelector(`[data-grade="${ds.q}"]`);const n=Object.keys(S.draft[ds.q]).length;if(b){b.disabled=n<e.quiz.length;const s=b.nextElementSibling;if(s)s.textContent=`${n}/${e.quiz.length} dijawab`}return}
  if('cek' in ds){const a=L().cek[ds.cek]||(L().cek[ds.cek]=[]);a[Number(ds.i)]=t.checked;save();return}
  if('kf' in ds&&t.tagName==='SELECT'){L().konsep[ds.kf]=t.value;const pr=PRESET.find(x=>x.n===t.value);if(pr&&!L().palTouched){L().pal=clone(pr.c);L().palSrc=pr.n;draw()}later();return}
  if('cs' in ds){panel();return}
});
app.addEventListener('input',ev=>{
  const t=ev.target,ds=t.dataset;
  if('pal' in ds){S.pal[ds.pal]=hexOk(t.value);const wasG=S.genre;S.genre=-1;S.me.mpal=clone(S.pal);S.me.mgenre=-1;later();if(wasG>=0){const gi=$('#ginfo');if(gi)gi.textContent='Palet buatan sendiri.';const pb=app.querySelector('[data-genre][aria-pressed="true"]');if(pb)pb.setAttribute('aria-pressed','false')}upd2();return}
  if('lpal' in ds){L().pal[ds.lpal]=hexOk(t.value);L().palSrc='Ubahan sendiri';L().palTouched=true;const pb=app.querySelector('[data-lgenre][aria-pressed="true"],[data-lmateri][aria-pressed="true"]');if(pb)pb.setAttribute('aria-pressed','false');updL();later();return}
  if('kelvin' in ds){L().kelvin=Number(t.value);const o=$('#o-kelvin');if(o)o.textContent=t.value+' K';updL();later();return}
  if('kf' in ds){L().konsep[ds.kf]=t.value.slice(0,2000);later();return}
  if('cs' in ds){const c=L().cams[S.lcam];c[ds.cs]=Number(t.value);const o=$('#o-'+ds.cs);if(o)o.textContent=fmt(ds.cs,c[ds.cs]);const s=$('#s180');if(s)s.innerHTML=s180html();draw();later();return}
  if('r' in ds){S.me.refleksi[Number(ds.r)]=t.value.slice(0,4000);later();return}
});
